[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Ordner-Auswahl-Dialog für den Textur-Hot-Reload-Watcher (ersetzt
# window.showDirectoryPicker aus der Browser-Variante).
tauri-plugin-dialog = "2"
# Dateisystemzugriff für den Textur-Hot-Reload-Watcher (readDir/watch).
# Wichtig: die vom Dialog gewählten Ordner werden NICHT automatisch in den
# fs-Scope aufgenommen — siehe TAURI_INTEGRATION_NOTES.md und den
# `grant_folder_access`-Command in lib.rs.
tauri-plugin-fs = "2"
